name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - run: npx cap add android

      - name: Set app icon
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png || true
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png || true
          done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            n=${d%%:*}; s=${d##*:}
            convert icon-maskable-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_foreground.png || true
          done
          sed -i 's/#FFFFFF/#FFF8E1/I' $RES/values/ic_launcher_background.xml || true

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: parrot-quiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
